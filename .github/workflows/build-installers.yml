name: Build Installers and Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['release-*']

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        run: python scripts/check_release_version.py

  build-installers:
    needs: validate
    name: ${{ matrix.platform }} installers and tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            args: --target universal-apple-darwin --bundles dmg -- --locked
          - os: windows-latest
            platform: windows
            args: --bundles msi,nsis -- --locked
          - os: ubuntu-22.04
            platform: linux
            args: --bundles appimage,deb,rpm -- --locked
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Mac architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: installers-${{ matrix.platform }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run test:ui
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do not define empty certificate/notarization variables: Tauri treats
          # their presence as a request to import a certificate or notarize.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          args: ${{ matrix.args }}
      - name: Collect and validate installers
        run: python scripts/collect_release_assets.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: binturong-${{ matrix.platform }}-release-files
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [validate, build-installers]
    # Manual runs and release branches only build; publishing requires a tag push.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binturong-*-release-files
          merge-multiple: true
          path: release-assets
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Stage complete release before making it public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json 2>/dev/null; then
            if ! jq -e '.isDraft == true' existing.json >/dev/null; then
              echo 'This release is already public. Publish fixes under a new version.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Binturong $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
